<script>
        // Micro-interaction: Confetti celebration effect on load
        function createConfetti() {
            const container = document.getElementById('main-canvas');
            const colors = ['#2fb2c1', '#90f1ff', '#006973', '#e1e3e4', '#ffffff'];
            
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti-particle animate-float';
                
                // Random position and size
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${80 + Math.random() * 20}%`;
                
                // Random color and animation delay
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDelay = `${Math.random() * 0.5}s`;
                particle.style.animationDuration = `${2 + Math.random() * 2}s`;
                
                container.appendChild(particle);
                
                // Clean up
                setTimeout(() => {
                    particle.remove();
                }, 4000);
            }
        }

        // Trigger confetti shortly after page load
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 300);
        });

        // Add a secondary burst when clicking a primary action
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(btn.classList.contains('bg-primary')) {
                    // Visual feedback for primary button
                }
            });
        });
    </script>
