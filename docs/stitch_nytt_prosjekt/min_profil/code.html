<script>
        function switchTab(tab) {
            const listsContent = document.getElementById('content-lists');
            const settingsContent = document.getElementById('content-settings');
            const tabLists = document.getElementById('tab-lists');
            const tabSettings = document.getElementById('tab-settings');
            const indicatorLists = document.getElementById('indicator-lists');
            const indicatorSettings = document.getElementById('indicator-settings');

            if (tab === 'lists') {
                listsContent.classList.remove('hidden');
                settingsContent.classList.add('hidden');
                
                tabLists.classList.add('text-primary');
                tabLists.classList.remove('text-on-surface-variant');
                tabSettings.classList.remove('text-primary');
                tabSettings.classList.add('text-on-surface-variant');

                indicatorLists.style.opacity = '1';
                indicatorSettings.style.opacity = '0';
            } else {
                listsContent.classList.add('hidden');
                settingsContent.classList.remove('hidden');
                
                tabSettings.classList.add('text-primary');
                tabSettings.classList.remove('text-on-surface-variant');
                tabLists.classList.remove('text-primary');
                tabLists.classList.add('text-on-surface-variant');

                indicatorLists.style.opacity = '0';
                indicatorSettings.style.opacity = '1';
            }
        }
